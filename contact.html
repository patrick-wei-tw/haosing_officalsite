<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜昊星科技有限公司</title>
  <meta name="description" content="聯絡昊星科技，洽詢企業專線、IDC、CDN、WAF、虛擬主機、設備採購與系統整合服務。">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/images/logo.svg" alt="Haosing Technology"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">選單</button>
    <nav id="site-nav" class="site-nav" aria-label="主要導覽">
      <a href="about.html">關於昊星</a>
      <a href="services.html">服務項目</a>
      <a href="products.html">經銷產品</a>
      <a href="solutions.html">解決方案</a>
      <a class="active nav-cta" href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="page-hero compact">
      <p class="eyebrow">Contact</p>
      <h1>告訴我們你的線路、機房、主機或資安需求</h1>
    </section>

    <section class="section contact-layout">
      <form class="contact-form" data-static-form>
        <label>
          姓名
          <input type="text" name="name" autocomplete="name" placeholder="請填寫您的大名">
        </label>
        <label>
          電子信箱
          <input type="email" name="email" autocomplete="email" placeholder="name@example.com">
        </label>
        <label>
          聯絡電話
          <input type="tel" name="phone" autocomplete="tel" placeholder="+886">
        </label>
        <label>
          需求主旨
          <input type="text" name="subject" placeholder="例如：企業專線 / WAF / 主機設備">
        </label>
        <label>
          需求說明
          <textarea name="message" rows="6" placeholder="請簡述目前需求、地點、預計時程或既有環境"></textarea>
        </label>
        <button class="button primary" type="submit">整理聯絡內容</button>
        <p class="form-note" role="status" aria-live="polite"></p>
      </form>

      <aside class="contact-card">
        <h2>聯絡資訊</h2>
        <ul>
          <li><span>Email</span><a href="mailto:service@haosing.net">service@haosing.net</a></li>
          <li><span>電話</span><a href="tel:+886289352900">+886 2 8935 2900</a></li>
          <li><span>傳真</span><span>+886 2 8935 2910</span></li>
          <li><span>地址</span><span>231 新北市新店區寶橋路 235 巷 5 號 5 樓</span></li>
        </ul>
      </aside>
    </section>
  </main>

  <footer class="site-footer"><p>Copyright © Haosing Technology. All rights reserved.</p></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
